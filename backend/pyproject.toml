[project]
name = "resume-backend"
version = "0.1.0"
description = "FastAPI + SQLAlchemy backend for the resume / blog / projects site"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "langgraph>=1.2.4",
    "langchain-core>=1.4.0",
    "langchain-google-genai>=4.2.4",
    "pgvector>=0.4.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
